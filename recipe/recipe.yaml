schema_version: 1

context:
  version: "1.29.0"

package:
  name: openmeteo-sdk
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/o/openmeteo-sdk/openmeteo_sdk-${{ version }}.tar.gz
  sha256: cbb927da212d7a02818743715ca07a84a83b951c4372e8399e20329c5de70fac

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - hatchling
    - pip
  run:
    - python >=${{ python_min }}
    - python-flatbuffers ==25.9.23

tests:
  - python:
      imports:
        - openmeteo_sdk
      pip_check: true
      python_version:
        - ${{ python_min }}
        - "*"

about:
  summary: Open-Meteo Python SDK
  license: MIT
  license_file: LICENSE
  homepage: https://pypi.org/project/openmeteo-sdk/
  repository: https://github.com/open-meteo/sdk
  documentation: https://github.com/open-meteo/sdk/tree/main

extra:
  recipe-maintainers:
    - akrherz
